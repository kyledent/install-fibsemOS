name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - run: python -m py_compile _common.py install.py verify.py launch.py install_autoscript_wheels.py check_autoscript_compat.py test_autoscript_poll.py shim/sitecustomize.py
      - run: python -m pytest tests -v

  install-smoke:
    # A real install.py run on Windows with Miniforge (mamba 2.x): exercises the
    # .exe lookup, the run-flag probe, env detection and the PyPI install.
    # No AutoScript: the client is licensed and never in this repository.
    name: install smoke test (windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          auto-activate-base: true
          activate-environment: ""
      - run: python install.py --skip-autoscript --yes --env ci-fibsem
      - run: python verify.py --skip-autoscript --env ci-fibsem
      - run: conda run -n ci-fibsem python launch.py --list

  bootstrap-from-zip:
    # What a user does: unpack the ZIP GitHub serves and run bootstrap.cmd.
    # git archive builds that ZIP (same .gitattributes: CRLF, export-ignore).
    # A fresh --miniforge-dir forces the download + checksum + silent install.
    name: bootstrap.cmd from the repo ZIP (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and unpack the download ZIP
        shell: pwsh
        run: |
          git archive --format=zip --prefix=install_fibsem-os_win11-main/ -o "$env:RUNNER_TEMP\repo.zip" HEAD
          Expand-Archive "$env:RUNNER_TEMP\repo.zip" -DestinationPath "$env:RUNNER_TEMP\unzipped"
          $root = "$env:RUNNER_TEMP\unzipped\install_fibsem-os_win11-main"
          if (Test-Path "$root\tests") { throw "tests/ should not be in the ZIP" }
          $bytes = [IO.File]::ReadAllBytes("$root\bootstrap.cmd")
          if (-not ($bytes -contains 13)) { throw "bootstrap.cmd in the ZIP is not CRLF" }
      - name: bootstrap.cmd
        shell: cmd
        run: call "%RUNNER_TEMP%\unzipped\install_fibsem-os_win11-main\bootstrap.cmd" --miniforge-dir "%RUNNER_TEMP%\mf" --mpc-host 192.0.2.10 --skip-autoscript --yes --env ci-boot
      - name: verify, with the fresh Miniforge not on PATH
        shell: cmd
        run: '"%RUNNER_TEMP%\mf\python.exe" "%RUNNER_TEMP%\unzipped\install_fibsem-os_win11-main\verify.py" --skip-autoscript --env ci-boot'
